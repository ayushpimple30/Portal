{% extends 'base.html' %}{% block content %}<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{{url_for('student.modules')}}">Modules</a></li><li class="breadcrumb-item active">{{module.title}}</li></ol></nav><p class="eyebrow">MODULE {{module.display_order}}</p><h1>{{module.title}}</h1><p class="lead">{{module.description}}</p><div class="card p-4 mb-4"><h2 class="h5">Lessons</h2>{% for lesson in module.lessons %}<div class="d-flex justify-content-between border-bottom py-3"><span><i class="fa-{{'solid fa-circle-check text-success' if lesson.id in completed else 'regular fa-circle'}}"></i> {{lesson.title}}</span><a href="{{url_for('student.lesson',lesson_id=lesson.id)}}">Open</a></div>{% endfor %}</div><a class="btn btn-primary" href="{{url_for('student.quiz',slug=module.slug)}}">Take module quiz</a>{% endblock %}
