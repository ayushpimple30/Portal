{% extends 'base.html' %}{% block content %}<h1>Quiz attempts</h1><div class="table-responsive"><table class="table"><tr><th>Student</th><th>Module</th><th>Score</th><th>Pass</th><th>Date</th></tr>{% for a in attempts.items %}<tr><td>{{a.user.full_name}}</td><td>{{a.module.title}}</td><td>{{a.percentage}}%</td><td>{{'Yes' if a.passed else 'No'}}</td><td>{{a.submitted_at.strftime('%d %b %Y')}}</td></tr>{% endfor %}</table></div>{% endblock %}
