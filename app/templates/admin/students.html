{% extends 'base.html' %}{% block content %}<h1>Students</h1><form class="row mb-3"><div class="col"><input class="form-control" name="q" value="{{q}}" placeholder="Search name or email"></div><div class="col-auto"><button class="btn btn-primary">Search</button></div></form><div class="table-responsive"><table class="table"><tr><th>Name</th><th>Email</th><th>Joined</th><th>Status</th><th></th></tr>{% for u in students.items %}<tr><td>{{u.full_name}}</td><td>{{u.email}}</td><td>{{u.created_at.strftime('%d %b %Y')}}</td><td>{{'Active' if u.is_active else 'Inactive'}}</td><td><form method="post" action="{{url_for('admin.toggle_student',user_id=u.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-outline-primary">{{'Deactivate' if u.is_active else 'Activate'}}</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
