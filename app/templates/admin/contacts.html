{% extends 'base.html' %}{% block content %}<h1>Contact messages</h1><form class="row mb-3"><div class="col"><input class="form-control" name="q" value="{{q}}" placeholder="Search messages"></div><div class="col-auto"><button class="btn btn-primary">Search</button></div></form>{% for c in contacts.items %}<article class="card p-3 mb-2"><div class="d-flex justify-content-between"><strong>{{c.subject}}</strong><span class="badge">{{c.status}}</span></div><small>{{c.name}} · {{c.email}} · {{c.created_at.strftime('%d %b %Y')}}</small><p class="my-2">{{c.message}}</p><form class="d-inline" method="post" action="{{url_for('admin.contact_status',message_id=c.id,status='read')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-outline-primary">Mark read</button></form> <form class="d-inline" method="post" action="{{url_for('admin.contact_status',message_id=c.id,status='resolved')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-outline-success">Resolve</button></form> <form class="d-inline" method="post" action="{{url_for('admin.contact_delete',message_id=c.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></article>{% endfor %}{% endblock %}
