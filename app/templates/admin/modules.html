{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Modules</h1><a class="btn btn-primary" href="{{url_for('admin.module_new')}}">Create module</a></div><div class="table-responsive"><table class="table"><tr><th>Order</th><th>Module</th><th>Visibility</th><th>Content</th><th></th></tr>{% for m in modules %}<tr><td>{{m.display_order}}</td><td>{{m.title}}</td><td>{{'Published' if m.published else 'Hidden'}}</td><td>{{m.lessons|length}} lessons · {{m.questions|length}} questions</td><td><a href="{{url_for('admin.module_edit',module_id=m.id)}}">Edit</a> · <a href="{{url_for('admin.lesson_new',module_id=m.id)}}">Lesson</a> <form class="d-inline" method="post" action="{{url_for('admin.module_delete',module_id=m.id)}}" onsubmit="return confirm('Delete this module and its content?')"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-link text-danger p-0">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
