{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Questions</h1><a class="btn btn-primary" href="{{url_for('admin.question_new')}}">Add question</a></div><div class="table-responsive"><table class="table"><tr><th>Module</th><th>Question</th><th>Difficulty</th><th></th></tr>{% for q in questions.items %}<tr><td>{{q.module.title}}</td><td>{{q.prompt[:90]}}</td><td>{{q.difficulty}}</td><td><a href="{{url_for('admin.question_edit',question_id=q.id)}}">Edit</a> <form class="d-inline" method="post" action="{{url_for('admin.question_delete',question_id=q.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-link text-danger p-0">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
